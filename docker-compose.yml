services:
  ferricstore:
    image: ${FERRICSTORE_IMAGE:-quay.io/ferricstore/ferricstore:0.12.18@sha256:e98e6ef91e028965598a2ed1b68981bab826a64749d97f6fecd6ecd4687bd3e1}
    ports:
      - "6388:6388"
    environment:
      FERRICSTORE_PROTECTED_MODE: "false"
      FERRICSTORE_FLOW_SCHEDULER_ENABLED: "false"
    volumes:
      - ferricstore_data:/data

volumes:
  ferricstore_data:
