services:
  ferricstore:
    image: ${FERRICSTORE_IMAGE:-quay.io/ferricstore/ferricstore:0.11.7@sha256:4e54e6846e168eb52deb24fb780edeb8c5bc94907812958cfd7ba048c657eedf}
    ports:
      - "6388:6388"
    environment:
      FERRICSTORE_PROTECTED_MODE: "false"
      FERRICSTORE_FLOW_SCHEDULER_ENABLED: "false"
    volumes:
      - ferricstore_data:/data

volumes:
  ferricstore_data:
