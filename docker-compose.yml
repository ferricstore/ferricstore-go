services:
  ferricstore:
    image: ${FERRICSTORE_IMAGE:-quay.io/ferricstore/ferricstore:0.11.21@sha256:d297c91414ecf206671685d6e74efcec715e5f14a96c5cef09ac5d8c4664c74b}
    ports:
      - "6388:6388"
    environment:
      FERRICSTORE_PROTECTED_MODE: "false"
      FERRICSTORE_FLOW_SCHEDULER_ENABLED: "false"
    volumes:
      - ferricstore_data:/data

volumes:
  ferricstore_data:
