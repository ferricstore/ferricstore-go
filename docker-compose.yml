services:
  ferricstore:
    image: ${FERRICSTORE_IMAGE:-quay.io/ferricstore/ferricstore:0.11.17@sha256:b1f260a5f01c8976c31daa828e375c8bb2e173f66e8ffc384b548a8b3d223230}
    ports:
      - "6388:6388"
    environment:
      FERRICSTORE_PROTECTED_MODE: "false"
      FERRICSTORE_FLOW_SCHEDULER_ENABLED: "false"
    volumes:
      - ferricstore_data:/data

volumes:
  ferricstore_data:
