name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to publish (for example v0.12.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Guard Version and Target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify immutable release identity before any publish
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-preflight.sh "$VERSION" "$GITHUB_SHA"

  quality:
    name: Quality and Compatibility
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - run: go mod download
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: ./scripts/api-compat.sh
      - run: ./scripts/fuzz-smoke.sh
      - name: Run repeated race and performance gates
        env:
          FERRICSTORE_STRESS_COUNT: "5"
          FERRICSTORE_BENCHTIME: 25x
        run: ./scripts/stress.sh

  vulnerability:
    name: Vulnerability Scan
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  integration:
    name: Released Server Integration
    needs: [preflight]
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - run: ./scripts/integration-docker.sh
      - run: ./scripts/integration-security-docker.sh
      - run: ./scripts/integration-cluster-docker.sh
      - run: ./scripts/integration-http-tls.sh

  release:
    name: Publish GitHub Release
    needs: [preflight, quality, vulnerability, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Recheck version immediately before publishing
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-preflight.sh "$VERSION" "$GITHUB_SHA"
      - name: Publish immutable module tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists at the verified target; resuming release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Release ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi
      - name: Resolve the published module through the public Go proxy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in {1..60}; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/ferricstore/ferricstore-go@${VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Go proxy did not resolve ${VERSION} after waiting for propagation" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION} already exists; nothing to duplicate."
          else
            gh release create "$VERSION" --generate-notes --verify-tag
          fi
